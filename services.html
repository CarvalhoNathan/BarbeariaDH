    <h1 class="section-title">Escolha um produto</h1>
    <main id="main-content">
        <figure
            class="card"
            style="background-image: url(assets/img/pomada-em-po.jpg)"
            role="img"
            aria-label="Foto de uma embalagem preta de pomada em pó para cabelos da marca Baboon, posicionada sobre uma bancada de madeira rústica no interior da barbearia, servindo como elemento decorativo e de demonstração de produto."
            >
            <h2>POMADA EM PÓ</h2>
            <a href="#"
            class="cardbot"
            aria-label="Botão interativo de comprar, localizado abaixo da descrição da pomada em pó, que inicia o processo de aquisição do produto selecionado.">
            Comprar</a>
        </figure>
        <figure
            class="card"
            style="background-image: url(assets/img/kit-keune.jpg)"
            role="img"
            aria-label="Foto de um kit de produtos capilares da marca Keune, composto por shampoo e condicionador em embalagens cinza e prata, posicionados sobre uma bancada de madeira rústica dentro da barbearia, reforçando o padrão de qualidade dos serviços oferecidos."
            >
            <h2>KIT KEUNE</h2>
            <a href="#" class="cardbot" aria-label="Botão interativo de comprar, posicionado junto ao Kit de tratamento Keune, que direciona o usuário para o checkout do conjunto de shampoo e condicionador.">Comprar</a>
        </figure>
        <figure
            class="card"
            style="background-image: url(assets/img/gel-baboon.jpg)"
            role="img"
            aria-label="Foto de várias latas coloridas de gel modelador da marca Baboon, com rótulos ilustrados de macacos, organizadas sobre um tapete rústico de sisal em uma bancada de madeira escura no interior da barbearia, servindo como demonstração da variedade de produtos disponíveis."
            >
            <h2>GEL BABOON</h2>
            <a href="#" class="cardbot" aria-label="Botão interativo de comprar, exibido na seção de gel modelador Baboon, que permite ao cliente adicionar o gel modelador ao carrinho de compras.">Comprar</a>
        </figure>
    </main>
